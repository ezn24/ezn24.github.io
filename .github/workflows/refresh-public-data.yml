name: Refresh public profile data
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-public-data.yml'
      - 'scripts/refresh-public-data.py'
      - 'scripts/commit-public-data.sh'
permissions:
  contents: write
concurrency:
  group: refresh-public-profile
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refresh and commit public statistics safely
        run: bash scripts/commit-public-data.sh
  request-pages-build:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pages: write
    steps:
      # Bot commits do not trigger branch-based Pages automatically. Request
      # the native build pipeline instead of racing it with deploy-pages.
      - name: Request native GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds" --silent
